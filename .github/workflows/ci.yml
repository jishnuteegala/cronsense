name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@v1
    with:
      post-check: |
        pnpm run build
        pnpm run check:privacy
        test -f dist/index.html
        test -f dist/design-system/index.html
        test -f dist/llms.txt
        test -f dist/_headers
        test -f dist/gotchas/dom-dow-or-semantics/index.html
        test -f dist/gotchas/uneven-step-reset/index.html
        test -f dist/gotchas/never-fires/index.html
        test -f dist/gotchas/sub-minimum-interval/index.html
        test -f dist/gotchas/high-load-delay-drop/index.html
        test -f dist/gotchas/inactivity-pause/index.html
        SOURCE_DATE_EPOCH=315532800 python -X utf8 scripts/package_release.py snapshot
        (cd artifact && sha256sum --check SHA256SUMS)
